name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: vendor/bin/pint

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      # The tree type-checks clean as of 2026-08-09. It hadn't been checked
      # before because two bad `types` entries in tsconfig made vue-tsc bail
      # early, hiding 17 real errors — so this guard exists to stop that
      # drifting again unnoticed.
      - name: Typecheck Frontend
        run: npm run typecheck

      # - name: Commit Changes
